[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saikyo-rates"
version = "1.0.0"
description = "USDT/RUB rate, foreign card terms and how to pay for foreign services from Russia (SAIKYO public API)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["usdt", "rub", "exchange rate", "russia", "payments", "visa"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Office/Business :: Financial"]

[project.urls]
Homepage = "https://saikyo.exchange/en/mcp-server"
Source = "https://github.com/saikyoexchange-dev/how-to-pay-from-russia-2026"

[tool.setuptools.packages.find]
where = ["src"]
